name: Build Flyball Ring Lights

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ring-lights-android
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          rm -rf platform_template android
          flutter create \
            --platforms=android \
            --org com.menaimuttineers \
            --project-name flyball_ring_lights \
            platform_template

          cp -R platform_template/android ./android
          rm -rf platform_template

          python3 - <<'PY2'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace(
              'android:label="flyball_ring_lights"',
              'android:label="Flyball Ring Lights"',
          )
          if 'android.permission.WAKE_LOCK' not in text:
              text = text.replace(
                  '>\n    <application',
                  '>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <application',
                  1,
              )
          manifest.write_text(text)

          settings = Path('android/settings.gradle.kts')
          s = settings.read_text()
          if 'com.google.gms.google-services' not in s:
              s = s.replace(
                  'plugins {\n',
                  'plugins {\n'
                  '    id("com.google.gms.google-services") version "4.4.4" apply false\n',
                  1,
              )
          settings.write_text(s)

          app_gradle = Path('android/app/build.gradle.kts')
          a = app_gradle.read_text()
          if 'com.google.gms.google-services' not in a:
              a = a.replace(
                  'plugins {\n',
                  'plugins {\n'
                  '    id("com.google.gms.google-services")\n',
                  1,
              )
          app_gradle.write_text(a)
          PY2

          cp firebase/google-services.json android/app/google-services.json

      - name: Get packages
        run: |
          flutter clean
          flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Friendly APK name
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk \
             build/app/outputs/flutter-apk/Flyball-Ring-Lights-Rev-0.3.1-Account-Fix.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flyball-Ring-Lights-Rev-0-3-1-Account-Fix-APK
          path: build/app/outputs/flutter-apk/Flyball-Ring-Lights-Rev-0.3.1-Account-Fix.apk
          if-no-files-found: error
          retention-days: 7
