name: Build Flyball Ring Lights

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ring-lights-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Generate Android and Web platform files
        run: |
          rm -rf platform_template android web
          flutter create \
            --platforms=android,web \
            --org com.menaimuttineers \
            --project-name flyball_ring_lights \
            platform_template

          cp -R platform_template/android ./android
          cp -R platform_template/web ./web
          rm -rf platform_template

          python3 - <<'PY2'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace(
              'android:label="flyball_ring_lights"',
              'android:label="Flyball Ring Lights"',
          )
          if 'android.permission.WAKE_LOCK' not in text:
              text = text.replace(
                  '>\n    <application',
                  '>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <application',
                  1,
              )
          manifest.write_text(text)

          settings = Path('android/settings.gradle.kts')
          s = settings.read_text()
          if 'com.google.gms.google-services' not in s:
              s = s.replace(
                  'plugins {\n',
                  'plugins {\n'
                  '    id("com.google.gms.google-services") version "4.4.4" apply false\n',
                  1,
              )
          settings.write_text(s)

          app_gradle = Path('android/app/build.gradle.kts')
          a = app_gradle.read_text()
          if 'com.google.gms.google-services' not in a:
              a = a.replace(
                  'plugins {\n',
                  'plugins {\n'
                  '    id("com.google.gms.google-services")\n',
                  1,
              )
          app_gradle.write_text(a)

          index = Path('web/index.html')
          w = index.read_text()
          w = w.replace(
              '<title>flyball_ring_lights</title>',
              '<title>Flyball Ring Lights</title>',
          )
          index.write_text(w)
          PY2

          cp firebase/google-services.json android/app/google-services.json

      - name: Get packages
        run: |
          flutter clean
          flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Friendly APK name
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk \
             build/app/outputs/flutter-apk/Flyball-Ring-Lights-Rev-0.5-Live-Ring.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flyball-Ring-Lights-Rev-0-5-Live-Ring-APK
          path: build/app/outputs/flutter-apk/Flyball-Ring-Lights-Rev-0.5-Live-Ring.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build Web
        run: flutter build web --release

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: Flyball-Ring-Lights-Rev-0-5-Live-Ring-Web
          path: build/web
          if-no-files-found: error
          retention-days: 7
