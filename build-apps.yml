name: Build Flyball Ring Lights

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ring-lights-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Generate Android and Web platform files
        run: |
          rm -rf platform_template android web
          flutter create --platforms=android,web --org com.menaimuttineers --project-name flyball_ring_lights platform_template
          cp -R platform_template/android ./android
          cp -R platform_template/web ./web
          rm -rf platform_template
          python3 - <<'PY2'
          from pathlib import Path
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text().replace('android:label="flyball_ring_lights"','android:label="Flyball Ring Lights"')
          if 'android.permission.WAKE_LOCK' not in text:
              text=text.replace('>\n    <application','>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <application',1)
          manifest.write_text(text)
          index=Path('web/index.html'); index.write_text(index.read_text().replace('<title>flyball_ring_lights</title>','<title>Flyball Ring Lights</title>'))
          PY2
      - name: Get packages
        run: |
          flutter clean
          flutter pub get
      - name: Build Android APK
        run: flutter build apk --debug
      - name: Friendly APK name
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/Flyball-Ring-Lights-Rev-0.1.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flyball-Ring-Lights-Rev-0-1-APK
          path: build/app/outputs/flutter-apk/Flyball-Ring-Lights-Rev-0.1.apk
          if-no-files-found: error
          retention-days: 7
      - name: Build Web
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: flutter build web --release --base-href "/${REPO_NAME}/"
      - name: Upload Web backup
        uses: actions/upload-artifact@v4
        with:
          name: Flyball-Ring-Lights-Rev-0-1-Web
          path: build/web
          retention-days: 7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages package
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy-web:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish Web App
        id: deployment
        uses: actions/deploy-pages@v4
