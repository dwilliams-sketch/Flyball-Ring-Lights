name: flyball_ring_lights
description: Flyball Ring Lights - Rev 0.6 performance, accessibility and display beta
publish_to: 'none'
version: 0.6.0+16

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.1
  wakelock_plus: ^1.3.2
  firebase_core: 4.12.1
  firebase_core_platform_interface: 8.0.0
  firebase_core_web: 3.9.1
  firebase_auth: 6.5.6
  firebase_auth_platform_interface: 9.0.5
  firebase_auth_web: 6.2.5
  cloud_firestore: ^6.1.0
  firebase_database: 12.4.6
  camera: ^0.12.0+2
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/red_beep.wav
    - assets/audio/go_beep.wav
